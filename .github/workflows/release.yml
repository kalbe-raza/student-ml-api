name: Release

# Release pipeline: runs ONLY when a semantic version tag is pushed.
# Responsibilities: test -> build -> version -> publish to GHCR.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/student-ml-api

jobs:
  release:
    name: Test, Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

      # The version is DERIVED from the pushed Git tag (v1.0.0 -> 1.0.0).
      # It is never hard-coded in this workflow.
      - name: Derive version from Git tag
        id: meta
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${RAW_TAG#v}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA"   >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER_LC/student-ml-api" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION from tag $RAW_TAG (commit $SHORT_SHA)"

      # Guard: the Git tag and the VERSION file must agree.
      - name: Verify VERSION file matches Git tag
        run: |
          FILE_VERSION="$(cat VERSION)"
          if [ "$FILE_VERSION" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::VERSION file ($FILE_VERSION) does not match Git tag (${{ steps.meta.outputs.version }})"
            exit 1
          fi
          echo "VERSION file and Git tag agree: $FILE_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authentication uses the automatically provided GITHUB_TOKEN.
      # No registry password is ever hard-coded in this repository.
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (version, latest, commit SHA)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            SOURCE_REPO=${{ github.server_url }}/${{ github.repository }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish traceability summary
        run: |
          {
            echo "## Release ${{ steps.meta.outputs.version }}"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Git tag | \`${GITHUB_REF#refs/tags/}\` |"
            echo "| Commit SHA | \`${{ github.sha }}\` |"
            echo "| Image | \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\` |"
            echo "| Also tagged | \`latest\`, \`${{ steps.meta.outputs.short_sha }}\` |"
            echo "| Image digest | \`${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
