name: CI

# Continuous Integration: validates every Pull Request targeting main.
# This workflow never publishes an artifact to the registry.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (validation only — not pushed)
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg SOURCE_REPO=${{ github.server_url }}/${{ github.repository }} \
            -t student-ml-api:ci-${{ github.sha }} .

      - name: Smoke-test the container
        run: |
          docker run -d --name ci-check -p 5000:5000 student-ml-api:ci-${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then echo "\nhealth OK"; exit 0; fi
            sleep 2
          done
          echo "health check failed"; docker logs ci-check; exit 1
